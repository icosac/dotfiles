# Status Bar
# -----------------------
set-option -g default-terminal "screen-256color"

set-option -g status on                # turn the status bar on
set-option -g status-interval 2        # set update frequency (default 15 seconds)
set-option -g status-justify centre    # center window list for clarity
set-option -g status-position top      # position the status bar at top of screen

# visual notification of activity in other windows
set -g monitor-activity on
set -g visual-activity on

# set color for status bar
set-option -g status-style "fg=white,bg=colour233,dim"

# set window list colors
set-window-option -g window-status-style "fg=blue,bg=white"
set-window-option -g window-status-current-style "fg=white,bg=brightblue,bright"

# show user name on left side of status bar
set-option -g status-left-length 20
set-option -g status-left-style default
set -g status-left '#[fg=#096500,bg=#afd700] #(whoami) '

# show mem/cpu (tmux-mem-cpu-load, see ./install.sh tmux-plugins) and date/time on the right
# (status-right goes through strftime, hence %% for a literal %)
set-option -g status-right-length 140
set-option -g status-right-style default
set-option -g status-right '#[fg=#b3b3b3,bg=#585858] #(tmux-mem-cpu-load | grep -o ".*%%") '
set-option -ag status-right '#[fg=#6c6c6c,bg=#d0d0d0] %Y/%m/%d %H:%M '

# mouse mode
set -g mouse on

# key bindings
bind '\' split-window -h
bind - split-window -v
bind-key -r j resize-pane -D 5
bind-key -r k resize-pane -U 5
bind-key -r h resize-pane -L 5
bind-key -r l resize-pane -R 5

# divider color
set -g pane-border-style "fg=default"
set -g pane-active-border-style "fg=blue,bg=default"
