# General
# -----------------------
# tmux-256color (italics etc.) where its terminfo exists, + RGB: true colors in neovim
if-shell 'infocmp tmux-256color' 'set -g default-terminal tmux-256color' 'set -g default-terminal screen-256color'
set -as terminal-features 'xterm*:RGB'

# Don't wait after <Esc> for a possible key sequence (default 500ms: laggy neovim)
set -s escape-time 10
set -g focus-events on
set -g history-limit 50000

# Pass modified keys like ctrl+shift+l through to apps (neovim), and ask the
# outer terminal (kitty, Ghostty: TERM=xterm-*) to send them
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Windows numbered from 1, renumbered when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# mouse mode
set -g mouse on

# Status bar (Nord, same palette as kitty/Ghostty; pills need a Nerd Font)
# Colors are lowercase: in formats #D, #F, #H... are tmux aliases (pane id, flags, host)
# -----------------------
set-option -g status on
set-option -g status-interval 2
set-option -g status-justify centre
set-option -g status-position top
set-option -g status-style "fg=#d8dee9,bg=#242933"

# activity in other windows: highlight the tab, no message popup
set -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style "fg=#ebcb8b,bg=#242933"

# left: session name (yellow while the prefix key is pressed)
set-option -g status-left-length 40
set -g status-left '#{?client_prefix,#[fg=#ebcb8b],#[fg=#88c0d0]}#[fg=#242933]#{?client_prefix,#[bg=#ebcb8b],#[bg=#88c0d0]}#[bold] #S#[nobold]#{?client_prefix,#[fg=#ebcb8b],#[fg=#88c0d0]}#[bg=#242933] '

# center: windows
setw -g window-status-separator ' '
setw -g window-status-format '#[fg=#3b4252]#[fg=#d8dee9,bg=#3b4252]#I #W#[fg=#3b4252,bg=#242933]'
setw -g window-status-current-format '#[fg=#81a1c1]#[fg=#242933,bg=#81a1c1,bold]#I #W#{?window_zoomed_flag, 󰊓,}#[fg=#81a1c1,bg=#242933,nobold]'

# right: mem/cpu (tmux-mem-cpu-load, see ./install.sh tmux-plugins), git branch of
# the active pane (only inside a repo), battery (only on machines that have one).
# Battery and branch come from tmux-status, next to this file in the repo.
set-option -g status-right-length 100
set-option -g status-right ''
set-option -ag status-right '#[fg=#3b4252]#[fg=#d8dee9,bg=#3b4252] #(tmux-mem-cpu-load -g 0 -a 0 -i 2)#[fg=#3b4252,bg=#242933] '
set-option -ag status-right '#(~/.local/bin/tmux-status git "#{pane_current_path}")'
set-option -ag status-right '#(~/.local/bin/tmux-status battery)'

# messages and copy-mode selection
set -g message-style "fg=#242933,bg=#88c0d0"
setw -g mode-style "fg=#242933,bg=#88c0d0"

# pane dividers
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#81a1c1"

# key bindings
# -----------------------
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind-key -r j resize-pane -D 5
bind-key -r k resize-pane -U 5
bind-key -r h resize-pane -L 5
bind-key -r l resize-pane -R 5
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
